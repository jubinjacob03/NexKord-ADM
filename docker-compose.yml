services:
  nexkord-adm:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexkord-adm:latest
    container_name: nexkord-adm
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/usr/src/app/logs
      - ./data/browser_profile:/usr/src/app/data/browser_profile
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  impostor:
    build:
      context: .
      dockerfile: Dockerfile.impostor
    container_name: impostor
    restart: unless-stopped
    ports:
      - "22023:22023/tcp"
      - "22023:22023/udp"
      - "22024:22024/tcp"
      - "22025:22025/tcp"
    environment:
      - IMPOSTOR_Server__PublicIp=${IMPOSTOR_SERVER_IP:-127.0.0.1}
      - IMPOSTOR_HttpServer__Enabled=true
      - IMPOSTOR_HttpServer__ListenPort=22024
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
