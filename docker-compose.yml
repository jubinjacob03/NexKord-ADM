services:
  nexkord-adm:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexkord-adm:latest
    container_name: nexkord-adm
    restart: unless-stopped
    depends_on:
      - warp
    env_file:
      - .env
    volumes:
      - ./logs:/usr/src/app/logs
      - ./data/browser_profile:/usr/src/app/data/browser_profile
      - ./data/akinator_profile:/usr/src/app/data/akinator_profile
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.9'
        reservations:
          memory: 256M
          cpus: '0.2'

  # Cloudflare WARP egress for the Akinator browser. Akinator's Cloudflare
  # hard-blocks datacenter IPs (403); WARP provides a non-datacenter egress.
  # The bot reaches it at socks5://warp:1080 (see AKINATOR_PROXY in .env).
  warp:
    image: caomingjun/warp
    container_name: warp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    device_cgroup_rules:
      - 'c 10:200 rwm'
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - WARP_SLEEP=2
    volumes:
      - ./data/warp:/var/lib/cloudflare-warp
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS --socks5-hostname localhost:1080 https://www.cloudflare.com/cdn-cgi/trace | grep -q warp=on"
      interval: 20s
      timeout: 10s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.3'

  impostor:
    build:
      context: .
      dockerfile: Dockerfile.impostor
    container_name: impostor
    restart: unless-stopped
    ports:
      - "22023:22023/tcp"
      - "22023:22023/udp"
      - "22024:22024/tcp"
      - "22025:22025/tcp"
    environment:
      - IMPOSTOR_Server__PublicIp=${IMPOSTOR_SERVER_IP:-127.0.0.1}
      - IMPOSTOR_HttpServer__Enabled=true
      - IMPOSTOR_HttpServer__ListenPort=22024
      - IMPOSTOR_API_KEY=${IMPOSTOR_API_KEY}
      - BOT_EVENT_URL=${BOT_EVENT_URL:-http://nexkord-adm:22026/events}
    deploy:
      resources:
        limits:
          memory: 200M
          cpus: '0.3'
        reservations:
          memory: 100M
          cpus: '0.1'
