services:
  nexkord-adm:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexkord-adm:latest
    container_name: nexkord-adm
    restart: unless-stopped
    depends_on:
      - warp
    env_file:
      - .env
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - NODE_OPTIONS=--max-old-space-size=1024
    volumes:
      - ./logs:/usr/src/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "0.9"
        reservations:
          memory: 512M
          cpus: "0.2"

  warp:
    image: backplane/wireproxy:latest
    container_name: warp
    restart: unless-stopped
    volumes:
      - ./data/warp/wireproxy.conf:/etc/wireproxy/config:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.3"
